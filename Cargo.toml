[package]
name = "rig-rag"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"

# Facade re-exports rig-core + rig-agent; enable qdrant companion.
rig = { version = "0.46", features = ["qdrant"] }
qdrant-client = "1.15"

chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

nanoid = "0.5"
thiserror = "2"
parking_lot = "0.13"

tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["time", "env-filter"] }
time = { version = "0.3" }

# Web
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.7", features = ["cors", "limit"] }
tower = "0.5"
tower_governor = { version = "0.8", features = ["axum"] }

# Database for user management
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "tls-none"] }

# Authentication
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
bcrypt = "0.19"

mini-moka = "0.10"
futures = "0.3"
# reqwest = { version = "0.12", features = ["json","rustls-tls"], default-features = false }

# Document parsing
pdf-extract = "0.12"
calamine = "0.38"
bytes = "1"
zip = "9"
quick-xml = "0.42"
encoding_rs = "0.8"
chardetng = "1"

# musl need OpenSSL
# openssl = { version = "0.10", features = ["vendored"] }


[lints.clippy]
new_without_default = "allow"
